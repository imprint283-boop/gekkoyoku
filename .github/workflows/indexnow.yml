# サイトが公開されるたびに、Bing などの検索エンジンへ「ページが更新された」と知らせる（IndexNow）
name: indexnow
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IndexNow に送る
        run: |
          KEY=969c9286eb2d4ff8acb10c969234a70e
          HOST=imprint283-boop.github.io
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/gekkoyoku/%s.txt","urlList":%s}' "$HOST" "$KEY" "$HOST" "$KEY" "$URLS")
          echo "$BODY"
          curl -sS -w "\nHTTP %{http_code}\n" -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" https://api.indexnow.org/indexnow
